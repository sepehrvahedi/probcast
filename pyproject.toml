[project]
name = "probcast"
version = "0.1.0.dev0"
description = "Point-in-time backtesting and probabilistic forecasting for equities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "ProbCast contributors" }]
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "arch>=7.0",
  "pyarrow>=17",
  "duckdb>=1.4,<2",
  "pydantic>=2.9",
  "pyyaml>=6",
  "exchange-calendars>=4.5",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "yfinance>=0.2.50",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tabulate>=0.10.0",
]

[project.scripts]
probcast = "probcast.cli:app"

[project.optional-dependencies]
ml = [
    "chronos-forecasting>=2.3.2",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.6",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "import-linter>=2.1",
  "scoringrules>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probcast", "src/probcast_analyzers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: requires internet access to free data sources",
  "slow: long-running",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "DTZ", "PT"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
"src/probcast/report/figures.py" = ["E402"]  # matplotlib.use("Agg") must precede pyplot import

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["probcast", "probcast_analyzers"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Analyzers may only import the public SDK"
type = "forbidden"
source_modules = ["probcast_analyzers"]
forbidden_modules = [
  "probcast.lake", "probcast.pit", "probcast.ingest", "probcast.engine",
  "probcast.scoring", "probcast.committee", "probcast.server", "probcast.report",
  "duckdb", "pyarrow", "yfinance", "httpx", "requests",
]
allow_indirect_imports = true
