# Neutral text (data plan §1.4 column rule; CRT-A-010): no y/y growth claims in descriptions.
# The FY2010 rows compared post-ASU-2009-13 revenue with pre-change as-reported revenue; the same
# "vs as-reported prior-year quarter" clause is removed from every earnings row for consistency.
description_rewrites:
  - event_types: [earnings]
    pattern: ',\s*[+-]\d+(?:\.\d+)?% vs as-reported prior-year quarter'
    replace: ''
    reason: CRT-A-010

overrides:
  AAPL-EV-20151216-02:
    reason: "CRT-A-009: became public on 17 Dec 2015 (8-K accepted 16:30:59 ET; Apple Newsroom 17 Dec 2015); 16 Dec is the board-action date (occurred_at)."
    content_available_at: "2015-12-17T16:30:59-05:00"
    time_precision: exact
    description: "8-K (Item 5.02) accepted 17 Dec 2015 16:30:59 ET (period of report 16 Dec 2015): Jeff Williams, SVP Operations, appointed Chief Operating Officer. Apple Newsroom release dated 17 Dec 2015."
    tags: "leadership;coo;avail:edgar_accept"
  AAPL-EV-20260730-01:
    reason: "CRT-A-011: add the Q3 FY2026 tariff-refund note (re-checked on the web 2026-11-18: MacTrast and MacRumors coverage of the 30 Jul 2026 release)."
    description_append: " Release states company gross margin of 50.1% includes a favourable impact of approximately 2 percentage points from tariff refunds, and diluted EPS includes a favourable impact of $0.11 from tariff refunds."

