# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-028
title: A steep yield curve is good for stocks
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: When long-term interest rates are well above short-term ones, investors tend to be paid more for
  holding stocks over the next year; banks gain most.
analyzer: macro.term_spread
implementation: 10-year minus 3-month Treasury yield, 21-day average, lagged a day (Fama & French 1989;
  Estrella & Mishkin 1998). C3, positive sign; 6 and 12 months.
