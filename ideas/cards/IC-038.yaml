# Round-3 advanced method (D-102).
id: IC-038
title: Calm markets and stormy markets behave differently
author: probcast
created_at: '2026-11-19T00:40:00Z'
sample: true
kind: advanced
text: Stocks switch between calm periods and stormy ones. When a statistical model says the stock is probably
  in its stormy phase, returns tend to be worse.
analyzer: advanced.regime_switching
implementation: Two-state Markov regime-switching model of monthly returns with switching variance (Hamilton
  1989; Ang & Bekaert 2002), refitted at every month-end on data known then; signal = probability of the
  high-volatility regime. C3, negative sign; 1, 3 and 6 months.
