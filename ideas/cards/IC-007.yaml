# Sample idea card (written as a demonstration).
id: IC-007
title: Cheap on earnings means higher future returns
author: probcast
created_at: '2026-11-18T18:00:00Z'
sample: true
text: When Apple's earnings yield (earnings per share divided by price, the inverse of the P/E) is high
  compared with its own history, the stock is cheap and should do better over the next year.
analyzer: valuation.earnings_yield
implementation: Trailing-12-month diluted EPS as first reported in SEC filings, divided by price; terciles
  of its own expanding history (C1; Basu 1977, Campbell & Shiller 1988).
