# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-031
title: Stocks reward holding through fear
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: When options imply much more market turbulence than has actually happened, investors are paying
  up for insurance, and stocks tend to reward those who hold them.
analyzer: volatility.variance_risk_premium
implementation: 'Bollerslev, Tauchen & Zhou (2009): VIX squared / 12 minus the past month''s realised
  S&P 500 variance. C3, positive sign; 3 and 6 months.'
