# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-024
title: Profits not backed by cash fade
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: Profits that aren't backed by real cash coming in tend to fade, and the market doesn't fully see
  it coming.
analyzer: fundamental.accruals
implementation: 'Sloan (1996), cash-flow method (Hribar & Collins 2002): trailing-12-month net income
  minus operating cash flow, over average total assets. Not used for financial companies. C3, negative
  sign; 6 and 12 months.'
