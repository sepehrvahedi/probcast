# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-018
title: Each stock has its good and bad months
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: A stock that has historically done well relative to the market in a particular calendar month tends
  to do so again in that month.
analyzer: calendar.same_month
implementation: 'Heston & Sadka (2008): average excess return over the market in the coming calendar month
  across the previous 1-20 years (at least 5). C3, positive sign; 1 month.'
