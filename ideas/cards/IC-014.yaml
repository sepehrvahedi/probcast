# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-014
title: Close to the 52-week high
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: When a stock trades close to its highest price of the past year, good news tends to keep being priced
  in slowly, so it tends to keep rising.
analyzer: technical.high52
implementation: Price divided by its 252-day high (George & Hwang 2004); terciles of the stock's own history
  (C1); 1, 3 and 6 months.
