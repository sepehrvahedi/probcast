# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-026
title: Spending sprees disappoint
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: When a company suddenly spends far more on buildings and equipment than it usually does, investors
  tend to be disappointed later.
analyzer: fundamental.capex_investment
implementation: 'Titman, Wei & Xie (2004): capital spending / sales (trailing 12 months) relative to its
  average over the previous three years, minus one. Not used for financial companies. C3, negative sign;
  6 and 12 months.'
