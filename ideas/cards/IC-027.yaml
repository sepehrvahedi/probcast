# Round-2 idea (researched, built and tested in round 2, D-101).
id: IC-027
title: Inventory piling up is a warning
author: probcast
created_at: '2026-11-19T00:30:00Z'
sample: true
text: When unsold goods pile up faster than sales grow, demand is probably cooling and bad news tends
  to follow.
analyzer: fundamental.inventory_vs_sales
implementation: 'Abarbanell & Bushee (1998), Thomas & Zhang (2002): year-on-year inventory growth minus
  year-on-year sales growth. Only for companies that carry inventory. C3, negative sign; 3 and 6 months.'
