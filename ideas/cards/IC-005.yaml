title: Rising real interest rates are bad for growth stocks
author: probcast
created_at: '2026-11-18T18:00:00Z'
sample: true
text: When real interest rates (inflation-adjusted bond yields) rise, expensive growth stocks like Apple
  should fall, because future profits are discounted more heavily.
