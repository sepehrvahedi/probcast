<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ProbCast — point-in-time backtesting and probabilistic forecasting for equities. Ex-ante by construction." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ProbCast</title>
    <script>
      // Apply the theme before first paint (dark by default; ux-spec §2.8).
      (() => {
        const root = document.documentElement;
        let theme = "dark";
        try {
          theme = localStorage.getItem("probcast.theme") === "light" ? "light" : "dark";
        } catch {
          theme = "dark";
        }
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      /* Boot frame: painted before the app bundle loads, replaced when React mounts. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d10; color: #a9b1bd;
        font: 500 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: .01em; }
      html:not(.dark) #boot { background: #f6f7f9; color: #46505d; }
      #boot .mark { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; color: #e8ebf0; }
      html:not(.dark) #boot .mark { color: #0f1419; }
      #boot .bar { margin-top: 14px; width: 160px; height: 2px; background: rgba(139,147,255,.18); overflow: hidden; border-radius: 2px; }
      #boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #8b93ff; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="Loading ProbCast"><div><div class="mark"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="4" fill="#4a50d9"/><path d="M3 12 C6 11 9 8 15 5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>ProbCast</div><div class="bar"></div><div style="margin-top:10px;font-size:11px;opacity:.75">Educational research tool. Not investment advice.</div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
